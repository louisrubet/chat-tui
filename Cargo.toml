[package]
name = "chat-tui"
version = "1.2.0"
edition = "2024"
license = "AGPL-3.0-only"
description = "Terminal chat interface shared by messaging clients"
repository = "https://github.com/louisrubet/chat-tui"

[dependencies]
crossterm = { version = "0.28", features = ["event-stream"] }
chrono = "0.4"
futures = "0.3"
tokio = { version = "1.48", features = ["macros", "rt", "time"] }
base64 = "0.22"
url = "2.5"
open = "5.3"
notify-rust = "4.18"
unicode-width = "0.2"
rand = "0.9"
# :shortcode: to emoji table.
emoji-expander = { git = "https://github.com/louisrubet/emoji-expander", tag = "v1.2.0" }
qrcode = { version = "0.14", default-features = false }
arboard = { version = "3.6.1", features = ["wayland-data-control"] }
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "gif", "webp"] }

[dev-dependencies]
tempfile = "3.9"
